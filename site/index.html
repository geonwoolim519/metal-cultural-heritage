<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>금속문화재박물관</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="./index.html">
        <img class="mark" src="./images/logo.png" alt="금속문화재박물관" />
        <span class="brand-text">
          <b>금속문화재박물관</b>
          <small>METAL HERITAGE MUSEUM</small>
        </span>
      </a>
      <nav class="nav">
        <button data-metal="" class="is-on">홈</button>
        <a href="./properties.html">금속의 성질</a>
        <button data-metal="gold">금</button>
        <button data-metal="gilt">금동</button>
        <button data-metal="bronze">청동</button>
        <button data-metal="silver">은</button>
        <button data-metal="iron">철</button>
      </nav>
    </header>

    <section class="hero" id="home">
      <img class="hero-photo" src="./images/forge-hero.jpg" alt="" />
      <div class="hero-shade"></div>
      <div class="hero-inner">
        <p class="kicker">금속문화재박물관</p>
        <h1>불에서 단련되고,<br />시간 속에 남다</h1>
        <p class="lede">재료가 다르면, 보존도 다르다</p>
        <p class="sub">대장간의 손에서 시작해, 금부터 철까지 금속의 성질로 읽습니다.</p>
      </div>
    </section>

    <section class="stage" id="gallery">
      <div class="gallery-wrap">
        <div class="gallery-head">
          <h2 data-gallery-title>전체</h2>
          <span data-gallery-count></span>
        </div>
        <div class="masonry" data-masonry></div>
      </div>
    </section>

    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
