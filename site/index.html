<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>금속문화재박물관</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="./index.html">
        <img class="mark" src="./images/logo.png" alt="금속문화재박물관" />
        <span class="brand-text">
          <b>금속문화재박물관</b>
          <small>METAL HERITAGE MUSEUM</small>
        </span>
      </a>
      <nav class="nav">
        <button data-metal="" class="is-on">홈</button>
        <a href="./properties.html">금속의 성질</a>
        <button data-metal="gold">금</button>
        <button data-metal="gilt">금동</button>
        <button data-metal="bronze">청동</button>
        <button data-metal="silver">은</button>
        <button data-metal="iron">철</button>
      </nav>
    </header>

    <section class="hero" id="home">
      <div class="hero-forge" aria-hidden="true">
        <div class="hero-grain"></div>
        <div class="hero-ember"></div>
        <div class="hero-hearth"></div>
        <svg class="hero-anvil" viewBox="0 0 640 280" fill="none">
          <path d="M92 118h78l18-22h214c28 0 42 10 54 28 8 12 28 18 48 18h44v28h-36c-14 0-24 6-32 16l-22 28H214l-28-28H92v-68Z" fill="#12110f" stroke="#3a342c" stroke-width="2"/>
          <path d="M214 194h252l18 36H198l16-36Z" fill="#0c0b0a" stroke="#2c2924" stroke-width="2"/>
          <path d="M248 230h188v22H248z" fill="#151310"/>
          <path d="M168 96h236c8 0 14 4 18 12H154c6-8 10-12 14-12Z" fill="#2a261f"/>
          <path d="M186 102h198" stroke="#d9a15a" stroke-width="1.2" opacity="0.55"/>
        </svg>
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>
        <span class="spark s5"></span>
        <span class="spark s6"></span>
      </div>
      <div class="hero-inner">
        <p class="kicker">금속문화재박물관</p>
        <h1>불에서 단련되고,<br />시간 속에 남다</h1>
        <p class="lede">재료가 다르면, 보존도 다르다</p>
        <p class="sub">대장간의 손에서 시작해, 금부터 철까지 금속의 성질로 읽습니다.</p>
        <div class="hero-actions">
          <a class="hero-cta" href="#gallery">소장품 보기</a>
          <a class="hero-cta is-ghost" href="./properties.html">금속의 성질</a>
        </div>
        <div class="hero-metals">
          <button type="button" data-metal="gold"><b>금</b><small>Au</small></button>
          <button type="button" data-metal="gilt"><b>금동</b><small>Cu · Au</small></button>
          <button type="button" data-metal="bronze"><b>청동</b><small>Cu</small></button>
          <button type="button" data-metal="silver"><b>은</b><small>Ag</small></button>
          <button type="button" data-metal="iron"><b>철</b><small>Fe</small></button>
        </div>
      </div>
    </section>

    <section class="stage" id="gallery">
      <div class="gallery-wrap">
        <div class="gallery-head">
          <h2 data-gallery-title>전체</h2>
          <span data-gallery-count></span>
        </div>
        <div class="masonry" data-masonry></div>
      </div>
    </section>

    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
