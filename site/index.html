<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>금속문화재 · Our Metal Heritage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="./index.html">
        <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
          <path d="M6 24c8-14 14-14 22 0" fill="none" stroke="#7a5cff" stroke-width="2.4" />
          <path d="M6 24c8-9 14-9 22 0" fill="none" stroke="#3aa0ff" stroke-width="2.4" />
          <circle cx="17" cy="22" r="3.2" fill="#e2a13a" />
        </svg>
        <span class="brand-text">
          <b>금속문화재</b>
          <small>METAL CULTURAL HERITAGE</small>
        </span>
      </a>
      <nav class="nav">
        <button data-metal="" class="is-on">홈</button>
        <button data-metal="gold">금</button>
        <button data-metal="gilt">금동</button>
        <button data-metal="bronze">청동</button>
        <button data-metal="silver">은</button>
        <button data-metal="iron">철</button>
      </nav>
    </header>

    <section class="hero" id="home">
      <div class="collage" aria-hidden="true">
        <img src="./images/hwangnam-crown.jpg" alt="" />
        <img src="./images/seongdeok-bell.jpg" alt="" />
        <img src="./images/baekje-incense.jpg" alt="" />
        <img src="./images/bangasayusang.jpg" alt="" />
        <img src="./images/cheonma-gwanmo.jpg" alt="" />
        <img src="./images/jeongji-armor.jpg" alt="" />
        <img src="./images/hwasun-daegok.jpg" alt="" />
        <img src="./images/jeongbyeong.jpg" alt="" />
      </div>
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <h1>Our Metal Heritage</h1>
        <p>재료가 다르면, 보존도 다르다 · 디지털헤리티지큐레이터 양성과정</p>
      </div>
    </section>

    <section class="stage" id="gallery">
      <div class="gallery-wrap">
        <div class="gallery-head">
          <h2 data-gallery-title>전체</h2>
          <span data-gallery-count></span>
        </div>
        <div class="masonry" data-masonry></div>
      </div>
    </section>

    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
