<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>금속문화재박물관</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="./index.html">
        <img class="mark" src="./images/logo.png" alt="금속문화재박물관" />
        <span class="brand-text">
          <b>금속문화재박물관</b>
          <small>METAL HERITAGE MUSEUM</small>
        </span>
      </a>
      <nav class="nav">
        <button data-metal="" class="is-on">홈</button>
        <a href="./properties.html">금속의 성질</a>
        <button data-metal="gold">금</button>
        <button data-metal="gilt">금동</button>
        <button data-metal="bronze">청동</button>
        <button data-metal="silver">은</button>
        <button data-metal="iron">철</button>
      </nav>
    </header>

    <section class="hero" id="home">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="kicker">METAL HERITAGE MUSEUM</p>
          <div class="hero-copy-row">
            <h1>금속문화재박물관</h1>
            <div>
              <p class="lede">재료가 다르면, 보존도 다르다</p>
              <p class="sub">금 · 금동 · 청동 · 은 · 철 — 금속의 성질로 읽는 전시</p>
            </div>
            <a class="hero-cta" href="#gallery">소장품 보기</a>
          </div>
        </div>
        <div class="hero-stage">
          <a class="hero-frame" href="./artifact.html?id=hwangnam-crown">
            <img src="./images/hwangnam-crown.jpg" alt="황남대총 북분 금관" />
            <span>금 · 황남대총 북분 금관</span>
          </a>
          <a class="hero-frame" href="./artifact.html?id=baekje-incense">
            <img src="./images/baekje-incense.jpg" alt="백제 금동대향로" />
            <span>금동 · 백제 금동대향로</span>
          </a>
          <a class="hero-frame" href="./artifact.html?id=seongdeok-bell">
            <img src="./images/seongdeok-bell.jpg" alt="성덕대왕신종" />
            <span>청동 · 성덕대왕신종</span>
          </a>
        </div>
        <div class="hero-metals">
          <button type="button" data-metal="gold">
            <img src="./images/hwangnam-crown.jpg" alt="" />
            <span><b>금</b><small>Au</small></span>
          </button>
          <button type="button" data-metal="gilt">
            <img src="./images/bangasayusang.jpg" alt="" />
            <span><b>금동</b><small>Cu + Au</small></span>
          </button>
          <button type="button" data-metal="bronze">
            <img src="./images/jeongbyeong.jpg" alt="" />
            <span><b>청동</b><small>Cu</small></span>
          </button>
          <button type="button" data-metal="silver">
            <img src="./images/muryeong-bracelet.jpg" alt="" />
            <span><b>은</b><small>Ag</small></span>
          </button>
          <button type="button" data-metal="iron">
            <img src="./images/jeongji-armor.jpg" alt="" />
            <span><b>철</b><small>Fe</small></span>
          </button>
        </div>
      </div>
    </section>

    <section class="stage" id="gallery">
      <div class="gallery-wrap">
        <div class="gallery-head">
          <h2 data-gallery-title>전체</h2>
          <span data-gallery-count></span>
        </div>
        <div class="masonry" data-masonry></div>
      </div>
    </section>

    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
