<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기획 · 금속문화재</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Song+Myung&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <section class="hero">
      <p class="kicker">About</p>
      <h1>금속만을 대상으로 한<br>웹전시</h1>
      <p class="lede">
        디지털헤리티지큐레이터 양성과정 중 문화재재료학 및 실험을 들으며,
        문화재는 재료별로 특징이 다르고 보존처리하는 법도 다르다는 점에서 출발했습니다.
        이 사이트는 그 수업의 시선을 금속문화재 8점에 고정합니다.
      </p>
    </section>
    <section class="section wrap">
      <div class="block">
        <span>정보 신뢰성</span>
        <p>정확한 원소 함량이나 합금비는 실제 과학적 분석자료가 확인된 경우에만 수치로 표시합니다. 확실하지 않은 제작기법은 “알려져 있다”, “추정된다”, “추가 분석이 필요하다”로 구분합니다.</p>
      </div>
    </section>
    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>
